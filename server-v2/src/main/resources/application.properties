spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chat_system}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jdbc.template.fetch-size=1000

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:120}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.paths=/api/**
app.rate-limit.trust-forwarded-headers=${RATE_LIMIT_TRUST_X_FORWARDED:false}
