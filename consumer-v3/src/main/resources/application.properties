spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chat_system}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

app.consumer.worker-threads=${CONSUMER_WORKER_THREADS:4}
app.consumer.prefetch-count=${CONSUMER_PREFETCH_COUNT:200}
app.consumer.consumer-timeout-seconds=${CONSUMER_TIMEOUT_SECONDS:30}

app.persistence.batch-size=${PERSIST_BATCH_SIZE:1000}
app.persistence.flush-interval-ms=${PERSIST_FLUSH_INTERVAL_MS:500}
app.persistence.writer-threads=${PERSIST_WRITER_THREADS:2}
app.persistence.write-queue-capacity=${PERSIST_QUEUE_CAPACITY:20000}
app.persistence.max-retries=${PERSIST_MAX_RETRIES:5}
app.persistence.base-backoff-ms=${PERSIST_BASE_BACKOFF_MS:100}
app.persistence.max-backoff-ms=${PERSIST_MAX_BACKOFF_MS:5000}
app.persistence.circuit-breaker-threshold=${PERSIST_CB_THRESHOLD:10}
app.persistence.circuit-breaker-open-ms=${PERSIST_CB_OPEN_MS:30000}

app.consumer.dlq-exchange=${CONSUMER_DLX:chat.deadletter.exchange}
app.consumer.dlq-queue=${CONSUMER_DLQ:chat.broadcast.dlq}
app.consumer.dlq-routing-key=${CONSUMER_DLQ_ROUTING_KEY:chat.broadcast.dlq}

management.endpoints.web.exposure.include=health,info
